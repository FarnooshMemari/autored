name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04  # Playwright 1.55 does not support 26.04 yet
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Install Chromium + system deps
        run: python -m playwright install --with-deps chromium
      - name: Contract is up to date
        run: |
          python -m autored export-schema
          git diff --exit-code ../contracts/events.schema.json
      - name: Tests (unit + real-browser E2E)
        run: python -m pytest -v -p no:warnings

  frontend:
    runs-on: ubuntu-24.04  # Playwright 1.55 does not support 26.04 yet
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
