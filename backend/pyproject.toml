[project]
name = "autored"
version = "0.1.0"
description = "AutoRed: multi-agent AI security assessment platform (authorized targets only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.4",
  "pyyaml==6.0.2",
  "playwright==1.55.0",
  "httpx==0.28.1",
  "python-multipart==0.0.20",  # test target login form
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0", "websockets==14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autored"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: drives real Chromium against the local test target"]
testpaths = ["tests"]
